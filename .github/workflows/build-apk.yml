
name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Check project ZIP
        run: test -f ClickerApp_OneClick.zip

      - name: Extract project
        run: |
          mkdir -p project
          unzip -q ClickerApp_OneClick.zip -d project
          test -f project/ClickerApp_OneClick/settings.gradle
          test -f project/ClickerApp_OneClick/app/build.gradle

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: project/ClickerApp_OneClick
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK was created
        run: test -f project/ClickerApp_OneClick/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Clicker-debug-APK
          path: project/ClickerApp_OneClick/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
